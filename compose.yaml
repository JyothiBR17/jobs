services:
  jobhunter:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: development
      LOCAL_DB: /srv/data/jobhunter.sqlite3
      PRIVATE_DIR: /srv/data/private
      ENABLE_SCHEDULER: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - jobhunter_data:/srv/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 35s

volumes:
  jobhunter_data:

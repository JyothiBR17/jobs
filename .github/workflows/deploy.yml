name: Azure deployment
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply after production environment approval
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: jobsai-production
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production-plan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OAUTH_CLIENT_SECRET }}
          tenant-id: d69bf108-84a8-4b7f-b72a-73d0181ae024
          subscription-id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
      - name: Plan
        env:
          TF_VAR_postgres_bootstrap_password: ${{ secrets.POSTGRES_BOOTSTRAP_PASSWORD }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_SECRET }}
          ARM_TENANT_ID: d69bf108-84a8-4b7f-b72a-73d0181ae024
          ARM_SUBSCRIPTION_ID: ed8f4826-ca81-4919-a8e9-79d5b2781b98
          TF_VAR_prefix: jobsai
          TF_VAR_subscription_id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
          TF_INPUT: "0"
          TF_VARS: ${{ vars.TERRAFORM_INPUTS_JSON }}
        run: |
          test -n "$TF_VARS"
          printf '%s' "$TF_VARS" > infra/ci.auto.tfvars.json
          terraform -chdir=infra init -backend-config=backend.hcl
          terraform -chdir=infra plan
  apply:
    needs: plan
    if: inputs.apply
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OAUTH_CLIENT_SECRET }}
          tenant-id: d69bf108-84a8-4b7f-b72a-73d0181ae024
          subscription-id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
      - name: Apply and verify
        env:
          TF_VAR_postgres_bootstrap_password: ${{ secrets.POSTGRES_BOOTSTRAP_PASSWORD }}
          TF_VARS: ${{ vars.TERRAFORM_INPUTS_JSON }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_SECRET }}
          ARM_TENANT_ID: d69bf108-84a8-4b7f-b72a-73d0181ae024
          ARM_SUBSCRIPTION_ID: ed8f4826-ca81-4919-a8e9-79d5b2781b98
          TF_VAR_prefix: jobsai
          TF_VAR_subscription_id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
          TF_INPUT: "0"
        run: |
          test -n "$TF_VARS"
          printf '%s' "$TF_VARS" > infra/ci.auto.tfvars.json
          terraform -chdir=infra init -backend-config=backend.hcl
          # Recover the account created before the failed storage data-plane check.
          prefix=$(python -c 'import json; print(json.load(open("infra/ci.auto.tfvars.json")).get("prefix", "jobsai"))')
          [[ "$prefix" =~ ^jobsai[a-z0-9]{0,10}$ ]]
          storage_id="/subscriptions/$ARM_SUBSCRIPTION_ID/resourceGroups/$prefix-rg/providers/Microsoft.Storage/storageAccounts/${prefix}docs"
          if ! terraform -chdir=infra state list | grep -Fxq 'azurerm_storage_account.main'; then
            if az storage account show --ids "$storage_id" --output none 2>/dev/null; then
              terraform -chdir=infra apply -target=azurerm_role_assignment.deployment_storage -auto-approve
              terraform -chdir=infra import azurerm_storage_account.main "$storage_id"
            fi
          fi
          terraform -chdir=infra plan -out=release.tfplan
          terraform -chdir=infra apply release.tfplan
          endpoint=$(terraform -chdir=infra output -raw web_url 2>/dev/null || true)
          if [ -n "$endpoint" ]; then
            curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 "$endpoint/health"
          fi

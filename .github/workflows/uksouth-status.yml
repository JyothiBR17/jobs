name: Job Hunter UK South live verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/uksouth-status.yml
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production-plan
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OAUTH_CLIENT_SECRET }}
          tenant-id: d69bf108-84a8-4b7f-b72a-73d0181ae024
          subscription-id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
      - name: Diagnose deployed Job Hunter image and container state read-only
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "ed8f4826-ca81-4919-a8e9-79d5b2781b98" ]]
          [[ "$(az group show -n jobsai-uksouth-rg --query location -o tsv)" == "uksouth" ]]
          az container show -g jobsai-uksouth-rg -n jobsai-uksouth-app --query \
            '{state:provisioningState,location:location,containers:containers[].{name:name,image:properties.image,state:properties.instanceView.currentState.state,exit:properties.instanceView.currentState.exitCode},fqdn:ipAddress.fqdn}' -o json
      - name: Verify only UK South Job Hunter resources and HTTPS
        run: |
          set -euo pipefail
          RG=jobsai-uksouth-rg
          CONTAINER=jobsai-uksouth-app
          location=$(az group show -n "$RG" --query location -o tsv)
          [[ "${location,,}" == uksouth ]] || exit 1
          az container show -g "$RG" -n "$CONTAINER" --query '{location:location,provisioning:provisioningState,publicFqdn:ipAddress.fqdn,containers:containers[].{name:name,state:instanceView.currentState.state}}' -o json
          fqdn=$(az container show -g "$RG" -n "$CONTAINER" --query ipAddress.fqdn -o tsv)
          [[ "$fqdn" == *.uksouth.azurecontainer.io ]] || exit 1
          echo "Public HTTPS URL: https://$fqdn"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
          curl --fail --silent --show-error "https://$fqdn/api/config" | python -c 'import json,sys;assert json.load(sys.stdin)["production"]'
          az resource list -g "$RG" --query '[].{name:name,type:type,location:location}' -o table
          echo "## Live Job Hunter UK South" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
          echo "Regional resource group: $RG. No other regions or apps were inspected or modified." >> "$GITHUB_STEP_SUMMARY"

      - name: Check Job Hunter Entra sign-in redirect registration
        env:
          TF_VARS: ${{ vars.TERRAFORM_INPUTS_JSON }}
        run: |
          set -euo pipefail
          client=$(python -c 'import json,os;print(json.loads(os.environ["TF_VARS"])["entra_client_id"])')
          info=$(az ad app show --id "$client" --query '{name:displayName,clientId:appId,spaRedirects:spa.redirectUris}' -o json 2>/dev/null || true)
          if [[ -z "$info" ]]; then
            echo "::warning::Unable to check Entra app registration. Dashboard health is verified, but interactive sign-in requires manual validation."
            exit 0
          fi
          echo "$info"
          if ! echo "$info" | python -c 'import json,sys;u=json.load(sys.stdin).get("spaRedirects") or [];assert any("jobsai-uksouth-jyothibr17.uksouth.azurecontainer.io" in x for x in u)'; then
            echo "::warning::Entra app does not yet list the UK South SPA redirect URI; login may require a dedicated app registration change."
          fi

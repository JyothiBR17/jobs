name: jobsai application image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app/**, migrations/**, web/**, requirements.txt, Dockerfile, .dockerignore]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/jyothibr17/jobsai:${{ github.sha }}
      - id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=ghcr.io/jyothibr17/jobsai@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Application image: ghcr.io/jyothibr17/jobsai@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OAUTH_CLIENT_SECRET }}
          tenant-id: d69bf108-84a8-4b7f-b72a-73d0181ae024
          subscription-id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
      - name: Deploy web and scheduled worker
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          PREFIX: ${{ vars.JOBSAI_PREFIX || 'jobsai' }}
        run: |
          set -euo pipefail
          [[ "$PREFIX" =~ ^jobsai[a-z0-9]{0,10}$ ]]
          az containerapp update --resource-group "$PREFIX-rg" --name "$PREFIX-web" --image "$IMAGE" --output none
          az containerapp job update --resource-group "$PREFIX-rg" --name "$PREFIX-worker" --image "$IMAGE" --output none
          host=$(az containerapp show --resource-group "$PREFIX-rg" --name "$PREFIX-web" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 "https://$host/health"

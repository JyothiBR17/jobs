name: Job Hunter UK South HTTPS container deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/uksouth-aci.yml
      - app/**
      - web/**
      - migrations/**
      - config/public-boards.json
      - Dockerfile.aci
      - requirements.txt
permissions:
  contents: read
  id-token: write
concurrency:
  group: jobsai-uksouth-aci
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      RG: jobsai-uksouth-rg
      LOC: uksouth
      ACCOUNT: jobsaiuksouth17
      REGISTRY: jobsaiuk17acr
      IDENTITY: jobsai-uksouth-runtime
      GROUP: jobsai-uksouth-app
      TF_VARS: ${{ vars.TERRAFORM_INPUTS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.OAUTH_CLIENT_SECRET }}
          tenant-id: d69bf108-84a8-4b7f-b72a-73d0181ae024
          subscription-id: ed8f4826-ca81-4919-a8e9-79d5b2781b98
      - name: Guard the UK South Job Hunter boundary
        run: |
          set -euo pipefail
          [[ "$RG" == jobsai-uksouth-rg && "$LOC" == uksouth ]]
          [[ "$ACCOUNT" == jobsaiuksouth17 && "$REGISTRY" == jobsaiuk17acr ]]
          [[ "$IDENTITY" == jobsai-uksouth-runtime && "$GROUP" == jobsai-uksouth-app ]]
          [[ "$(az account show --query id -o tsv)" == ed8f4826-ca81-4919-a8e9-79d5b2781b98 ]]
          python - <<'PY'
          import json, os, re
          cfg = json.loads(os.environ["TF_VARS"])
          for k in ("entra_client_id", "entra_owner_oid"):
              if not re.fullmatch("[0-9a-fA-F-]{36}", cfg.get(k, "")):
                  raise SystemExit("Missing Job Hunter credential metadata: " + k)
          PY
          az group show -n "$RG" --query location -o tsv | grep -Fx uksouth
      - name: Create dedicated UK South registry and image
        run: |
          set -euo pipefail
          if ! az acr show -g "$RG" -n "$REGISTRY" -o none 2>/dev/null; then
            az acr create -g "$RG" -n "$REGISTRY" -l "$LOC" --sku Basic --admin-enabled false -o none
          fi
          location=$(az acr show -g "$RG" -n "$REGISTRY" --query location -o tsv)
          [[ "${location,,}" == uksouth ]] || { echo "::error::Registry location mismatch"; exit 1; }
          # ACR Tasks are disallowed on this free subscription. Build with the
          # GitHub-hosted Docker daemon and push through Entra RBAC instead.
          registry_id=$(az acr show -g "$RG" -n "$REGISTRY" --query id -o tsv)
          deploy_principal=0a34ff40-76b9-4459-b5d2-6fde206db4ff
          existing=$(az role assignment list --scope "$registry_id" --assignee-object-id "$deploy_principal" --query "[?roleDefinitionName=='AcrPush'].id | [0]" -o tsv)
          if [[ -z "$existing" ]]; then
            az role assignment create --scope "$registry_id" --role AcrPush --assignee-object-id "$deploy_principal" --assignee-principal-type ServicePrincipal -o none
          fi
          logged_in=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if az acr login --name "$REGISTRY" -o none; then
              logged_in=true
              break
            fi
            sleep 15
          done
          [[ "$logged_in" == true ]] || { echo "::error::Entra registry push permission unavailable"; exit 1; }
          docker build -f Dockerfile.aci -t "$REGISTRY.azurecr.io/jobhunter:$GITHUB_SHA" .
          docker push "$REGISTRY.azurecr.io/jobhunter:$GITHUB_SHA"
      - name: Prepare dedicated UK South identity and encrypted storage
        run: |
          set -euo pipefail
          if ! az identity show -g "$RG" -n "$IDENTITY" -o none 2>/dev/null; then
            az identity create -g "$RG" -n "$IDENTITY" -l "$LOC" -o none
          fi
          if ! az storage account show -g "$RG" -n "$ACCOUNT" -o none 2>/dev/null; then
            az storage account create -g "$RG" -n "$ACCOUNT" -l "$LOC" --kind StorageV2 --sku Standard_LRS --min-tls-version TLS1_2 --allow-blob-public-access false --allow-shared-key-access true -o none
          fi
          actual=$(az storage account show -g "$RG" -n "$ACCOUNT" --query location -o tsv)
          [[ "${actual,,}" == uksouth ]]
          shared=$(az storage account show -g "$RG" -n "$ACCOUNT" --query allowSharedKeyAccess -o tsv)
          [[ "$shared" != false && "$shared" != False ]] || { echo "::error::Azure Files requires Shared Key for the private file mount"; exit 1; }
          key=$(az storage account keys list -g "$RG" -n "$ACCOUNT" --query '[0].value' -o tsv)
          [[ -n "$key" ]]
          for share in jobsai-db jobsai-caddy-conf jobsai-caddy-data; do
            az storage share create --account-name "$ACCOUNT" --account-key "$key" --name "$share" --quota 5 -o none
          done
          az storage container create --account-name "$ACCOUNT" --account-key "$key" --name jobsai-resumes --public-access off -o none
          printf ':80 {\n  respond "Preparing HTTPS" 503\n}\n' > /tmp/Caddyfile
          share_exists=$(az storage share exists --account-name "$ACCOUNT" --account-key "$key" --name jobsai-caddy-conf --query exists -o tsv)
          [[ "$share_exists" == true || "$share_exists" == True ]] || { echo "::error::The UK South Caddy configuration share was not created"; exit 1; }
          az storage file upload --account-name "$ACCOUNT" --account-key "$key" --share-name jobsai-caddy-conf --source /tmp/Caddyfile --no-progress -o none
          identity_id=$(az identity show -g "$RG" -n "$IDENTITY" --query id -o tsv)
          principal=$(az identity show -g "$RG" -n "$IDENTITY" --query principalId -o tsv)
          registry_id=$(az acr show -g "$RG" -n "$REGISTRY" --query id -o tsv)
          storage_id=$(az storage account show -g "$RG" -n "$ACCOUNT" --query id -o tsv)
          for entry in "$registry_id|AcrPull" "$storage_id|Storage Blob Data Contributor"; do
            scope=${entry%%|*}
            role=${entry#*|}
            if [[ -z "$(az role assignment list --scope "$scope" --assignee-object-id "$principal" --query "[?roleDefinitionName=='$role'].id | [0]" -o tsv)" ]]; then
              az role assignment create --scope "$scope" --role "$role" --assignee-object-id "$principal" --assignee-principal-type ServicePrincipal -o none
            fi
          done
      - name: Provision dedicated UK South OpenAI Key Vault
        run: |
          set -euo pipefail
          VAULT=jobsaiuksouth17kv
          [[ "$RG" == jobsai-uksouth-rg && "$LOC" == uksouth ]]
          if ! az keyvault show -n "$VAULT" -g "$RG" -o none 2>/dev/null; then
            az keyvault create -n "$VAULT" -g "$RG" -l "$LOC" --sku standard --enable-rbac-authorization true -o none
          fi
          vault_location=$(az keyvault show -n "$VAULT" -g "$RG" --query location -o tsv)
          [[ "${vault_location,,}" == uksouth ]] || { echo "::error::Job Hunter Key Vault region mismatch"; exit 1; }
          vault_id=$(az keyvault show -n "$VAULT" -g "$RG" --query id -o tsv)
          principal=$(az identity show -g "$RG" -n "$IDENTITY" --query principalId -o tsv)
          existing=$(az role assignment list --scope "$vault_id" --assignee-object-id "$principal" --query "[?roleDefinitionName=='Key Vault Secrets Officer'].id | [0]" -o tsv)
          if [[ -z "$existing" ]]; then
            az role assignment create --scope "$vault_id" --role 'Key Vault Secrets Officer' --assignee-object-id "$principal" --assignee-principal-type ServicePrincipal -o none
          fi
      - name: Create private app and HTTPS sidecar on Azure Container Instances
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEVER_APPLY_KEYS_JSON: ${{ secrets.LEVER_APPLY_KEYS_JSON }}
        run: |
          set -euo pipefail
          key=$(az storage account keys list -g "$RG" -n "$ACCOUNT" --query '[0].value' -o tsv)
          identity_id=$(az identity show -g "$RG" -n "$IDENTITY" --query id -o tsv)
          identity_client=$(az identity show -g "$RG" -n "$IDENTITY" --query clientId -o tsv)
          export key identity_id identity_client
          python - <<'PY'
          import json, os
          c=json.loads(os.environ["TF_VARS"])
          ac=os.environ["ACCOUNT"]
          identity=os.environ["identity_id"]
          image=f'{os.environ["REGISTRY"]}.azurecr.io/jobhunter:{os.environ["GITHUB_SHA"]}'
          boards=c.get("job_boards_json", "[]")
          if not json.loads(boards):
              boards=open("config/public-boards.json").read()
          values={
              "APP_ENV":"production", "APP_DB_ENGINE":"sqlite",
              "LOCAL_DB":"/home/jobsai.sqlite3", "ENABLE_SCHEDULER":"true",
              "ENTRA_TENANT":"d69bf108-84a8-4b7f-b72a-73d0181ae024",
              "ENTRA_CLIENT_ID":c["entra_client_id"],
              "ENTRA_AUDIENCE":c["entra_client_id"],
              "ENTRA_SCOPE":f'api://{c["entra_client_id"]}/access_as_user',
              "ENTRA_OWNER_OID":c["entra_owner_oid"],
              "AZURE_CLIENT_ID":os.environ["identity_client"],
              "BLOB_ACCOUNT_URL":f"https://{ac}.blob.core.windows.net/",
              "BLOB_CONTAINER":"jobsai-resumes",
              "JOB_BOARDS_JSON":boards,
              "AZURE_KEY_VAULT_URL":"https://jobsaiuksouth17kv.vault.azure.net/",
              "OPENAI_MODEL":"gpt-5-mini",
              "MAX_MONTHLY_MODEL_REQUESTS":"500",
              "VERIFY_PUBLIC_REGISTRIES":"yes"
          }
          env=[{"name":k, "value":v} for k,v in values.items()]
          for name in ("OPENAI_API_KEY", "LEVER_APPLY_KEYS_JSON"):
              if os.environ.get(name):
                  env.append({"name": name, "secureValue": os.environ[name]})
          print("Agent secrets configured:", bool(os.getenv("OPENAI_API_KEY")),
                "OpenAI, and", bool(os.getenv("LEVER_APPLY_KEYS_JSON")),
                "authorized ATS API mappings (contents never logged)")
          def volume(name, share):
              return {"name":name,"azureFile":{"shareName":share,"storageAccountName":ac,"storageAccountKey":os.environ["key"]}}
          def mount(name,path):
              return {"name":name,"mountPath":path}
          group={
            "name":os.environ["GROUP"], "apiVersion":"2023-05-01",
            "location":"uksouth",
            "identity":{"type":"UserAssigned","userAssignedIdentities":{identity:{}}},
            "properties":{
              "containers":[
                {"name":"app","properties":{
                  "image":image, "ports":[{"port":8000,"protocol":"TCP"}],
                  "environmentVariables":env,
                  "resources":{"requests":{"cpu":0.5,"memoryInGB":1.0}},
                  "volumeMounts":[mount("database","/home")]
                }},
                {"name":"caddy","properties":{
                  "image":"caddy:2", "ports":[{"port":80,"protocol":"TCP"},{"port":443,"protocol":"TCP"}],
                  "resources":{"requests":{"cpu":0.5,"memoryInGB":0.5}},
                  "volumeMounts":[mount("caddyconf","/etc/caddy"),mount("caddydata","/data")]
                }}
              ],
              "imageRegistryCredentials":[{"server":f'{os.environ["REGISTRY"]}.azurecr.io',"identity":identity}],
              "ipAddress":{
                "type":"Public","dnsNameLabel":"jobsai-uksouth-jyothibr17",
                "ports":[{"protocol":"TCP","port":80},{"protocol":"TCP","port":443}]
              },
              "restartPolicy":"Always","osType":"Linux",
              "volumes":[volume("database","jobsai-db"),volume("caddyconf","jobsai-caddy-conf"),volume("caddydata","jobsai-caddy-data")]
            }
          }
          open("/tmp/jobsai-uksouth-aci.json","w").write(json.dumps(group))
          PY
          if az container show -g "$RG" -n "$GROUP" -o none 2>/dev/null; then
            live_location=$(az container show -g "$RG" -n "$GROUP" --query location -o tsv)
            [[ "${live_location,,}" == uksouth ]] || { echo "::error::Existing container group is outside UK South"; exit 1; }
          fi
          az container create -g "$RG" --file /tmp/jobsai-uksouth-aci.json -o none
      - name: Issue automatic TLS certificate and smoke-test the app
        run: |
          set -euo pipefail
          fqdn=$(az container show -g "$RG" -n "$GROUP" --query ipAddress.fqdn -o tsv)
          [[ "$fqdn" == *.uksouth.azurecontainer.io ]] || { echo "::error::Unexpected Container Instances domain"; exit 1; }
          printf '%s {\n  reverse_proxy http://localhost:8000\n}\n' "$fqdn" > /tmp/Caddyfile
          key=$(az storage account keys list -g "$RG" -n "$ACCOUNT" --query '[0].value' -o tsv)
          az storage file upload --account-name "$ACCOUNT" --account-key "$key" --share-name jobsai-caddy-conf --source /tmp/Caddyfile --no-progress -o none
          unset key
          az container restart -g "$RG" -n "$GROUP" -o none
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
          curl --fail --silent --show-error "https://$fqdn/api/config" | python -c 'import sys,json; assert json.load(sys.stdin)["production"] is True'
          echo '## Job Hunter UK South — Azure Container Instances' >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS dashboard: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
          echo "All created resources: $RG, UK South only." >> "$GITHUB_STEP_SUMMARY"
          echo 'Private resume Blob and Azure Files, dedicated managed identity and ACR. Single-instance pilot SQLite database.' >> "$GITHUB_STEP_SUMMARY"

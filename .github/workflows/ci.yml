name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: localci
          POSTGRES_DB: jobhunter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff pip-audit bandit
      - run: ruff check app tests
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          TEST_POSTGRES_URL: postgresql://jobhunter:localci@127.0.0.1:5432/jobhunter_test
      - run: bandit -r app -lll
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
